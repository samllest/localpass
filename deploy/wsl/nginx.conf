server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    location = /health { access_log off; return 200 'ok\n'; }
    location / { try_files $uri $uri/ =404; }
    location ~* \.(exe|zip)$ {
        add_header Content-Disposition attachment;
        add_header X-Content-Type-Options nosniff always;
    }
}
