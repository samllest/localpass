<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LocalPass 连接状态</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon-32.png" width="32" height="32" alt="" />
      <div>
        <strong>LocalPass</strong>
        <p>浏览器登录助手</p>
      </div>
    </header>
    <main aria-live="polite">
      <section>
        <h2>扩展更新</h2>
        <p id="extension-update">正在检查版本…</p>
      </section>
      <section>
        <h1>桌面连接</h1>
        <p id="connection">正在检查…</p>
      </section>
      <section>
        <h2>当前网页</h2>
        <p id="page">正在检查…</p>
      </section>
      <section>
        <h2>最近一次登录</h2>
        <p id="capture">正在检查…</p>
        <p id="capture-time" class="muted"></p>
      </section>
      <p class="hint">在登录输入框按 Alt+Shift+L，可进入 LocalPass 账号选择。</p>
      <p class="hint">保持桌面端已解锁。更新扩展后，请刷新网站登录页，再登录一次。</p>
      <button id="refresh" type="button">重新检查</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
